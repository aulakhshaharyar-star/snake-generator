name: generate animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: muhammadshaharyaraulakh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff4500&color_dots=#ebedf0,#ffb399,#ff7733,#ff4500,#cc3700
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff4500&color_dots=#161b22,#4d1500,#802200,#b33000,#ff4500
            
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
